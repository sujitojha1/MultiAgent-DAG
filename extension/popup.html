<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <section class="glass">
      <header class="hdr">
        <div class="hdr-left">
          <img src="icons/icon48.png" alt="" class="logo" />
          <div class="hdr-text">
            <h1>PulseDAG</h1>
            <p>GitHub Repo Radar</p>
          </div>
        </div>
        <div class="status-note">
          <span id="status-dot" class="dot dot-unknown"></span>
          <span id="status-text">Checking bridge…</span>
          <span id="status-elapsed"></span>
        </div>
      </header>
    </section>

    <section class="glass controls">
      <div class="row">
        <div class="field grow-2 relative">
          <span class="field-label">Languages</span>
          <div id="multiselect-container" class="multiselect-container">
            <div id="multiselect-input" class="multiselect-input">
              <div id="selected-tags" class="selected-tags"></div>
              <input type="text" id="multiselect-search" placeholder="Select languages..." autocomplete="off" spellcheck="false" />
              <span class="multiselect-arrow">▼</span>
            </div>
            <div id="multiselect-dropdown" class="multiselect-dropdown hidden"></div>
          </div>
        </div>

        <div class="field grow-1">
          <span class="field-label">Window</span>
          <div class="chips" id="window-chips">
            <div class="chip" data-value="daily" title="Daily">D</div>
            <div class="chip on" data-value="weekly" title="Weekly">W</div>
            <div class="chip" data-value="monthly" title="Monthly">M</div>
          </div>
        </div>
      </div>

      <div class="row align-end">
        <div class="field grow-2">
          <span class="field-label">Topic / mode</span>
          <input id="mode" type="text" placeholder="agentic / MCP / dev-tooling" />
        </div>
        <button id="dice" class="btn-dice" title="Random pick from the digest">🎲</button>
        <button id="run" class="btn-run">▶ Run</button>
      </div>
    </section>

    <section id="result" class="glass result hidden">
      <div class="result-bar">
        <span id="result-meta" class="result-meta"></span>
      </div>
      <div id="digest" class="digest"></div>
    </section>

    <section id="empty" class="glass empty">
      <p class="lead">Pick your languages and window, then hit <strong>Run</strong>.</p>
      <p class="hint">Needs the bridge: <code class="copyable-command" title="Click to copy" id="copy-cmd-hint">uv run python bridge_server.py</code> on <code>:8109</code></p>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
